<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ashutosh Kumar: Business Analyst to Business Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.55" r="0.42">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="760" height="300" fill="url(#fade)"/>

  <!-- career journey: lead to support -->
  <path d="M 700 262 C 820 250, 900 222, 960 182 S 1080 96, 1150 62" fill="none" stroke="#bfdbfe" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M 700 262 C 820 250, 900 222, 960 182 S 1080 96, 1150 62" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="14 520">
    <animate attributeName="stroke-dashoffset" from="534" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="2" fill="#93c5fd" text-anchor="middle">
    <circle cx="772" cy="252" r="26" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.5" filter="url(#soft)">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772" cy="252" r="24" fill="#020617" stroke="#60a5fa" stroke-width="3"/>
    <text x="772" y="214">LEAD</text>

    <circle cx="858" cy="236" r="21" fill="#020617" stroke="#bfdbfe" stroke-opacity="0.75" stroke-width="2"/>
    <text x="858" y="202">DEMO</text>

    <circle cx="934" cy="204" r="21" fill="#020617" stroke="#bfdbfe" stroke-opacity="0.75" stroke-width="2"/>
    <text x="934" y="170">BRD</text>

    <circle cx="1000" cy="160" r="21" fill="#020617" stroke="#bfdbfe" stroke-opacity="0.75" stroke-width="2"/>
    <text x="1000" y="126">UAT</text>

    <circle cx="1068" cy="114" r="21" fill="#020617" stroke="#bfdbfe" stroke-opacity="0.75" stroke-width="2"/>
    <text x="1068" y="80">GO-LIVE</text>

    <circle cx="1140" cy="68" r="22" fill="#020617" stroke="#bfdbfe" stroke-opacity="0.75" stroke-width="2"/>
    <text x="1140" y="34">GROWTH</text>
  </g>

  <circle cx="68" cy="83" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="88" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#93c5fd">OPEN TO BA · BD · PRE-SALES ROLES</text>

  <text x="62" y="158" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="1" fill="#ffffff">ASHUTOSH KUMAR</text>
  <text x="64" y="202" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#cbd5e1">Business Analyst <tspan fill="#3b82f6" font-weight="700">→</tspan> Business Development</text>
  <rect x="64" y="224" width="132" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="64" y="258" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#94a3b8">B2B SAAS · PRE-SALES · DEMO → BRD → UAT → GO-LIVE · GEOSPATIAL AI</text>
</svg>
